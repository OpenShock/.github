name: Bug Report
description: Something isn't working as expected.
title: '[Bug] '

body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Report them privately as described in the [security policy](https://github.com/OpenShock/.github/blob/main/SECURITY.md).

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I checked that no other issue describes my problem.
          required: true
        - label: I am using the latest release, or the officially hosted instance.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you are running. Write "hosted" for the officially hosted instance at openshock.app.
      placeholder: 'E.g.: 3.17.0, hosted, ..'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Anything relevant about your setup, such as browser, operating system, hub board and firmware version, or self-hosting details.

  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Remove tokens, passwords, email addresses and other personal data before pasting.
